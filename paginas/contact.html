<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | Gabriel Quintana</title>

    <link rel="stylesheet" href="../estilos.css">

</head>

<body>

    <main class="contact-page">

        <a href="../index.html" class="back-btn">

            ← Volver al portfolio

        </a>

        <section class="contact-header">

            <h1>Contacto</h1>

            <p>

                Si te interesa trabajar conmigo o realizar una consulta,
                podés completar el siguiente formulario.

            </p>

        </section>

        <form class="contact-form">

            <label>Nombre</label>

            <input
                type="text"
                placeholder="Tu nombre"
                required>

            <label>Email</label>

            <input
                type="email"
                placeholder="nombre@email.com"
                required>

            <label>Mensaje</label>

            <textarea
                rows="8"
                placeholder="Escribí tu mensaje..."
                required></textarea>

            <button type="submit">

                Enviar

            </button>

        </form>

    </main>

</body>

</html>
