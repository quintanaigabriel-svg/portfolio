<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | Gabriel Quintana</title>

    <link rel="stylesheet" href="../estilos.css">

</head>

<body>

    <main class="contact-page">

        <a href="../index.html" class="back-btn">

            ← Volver al portfolio

        </a>

        <section class="contact-header">

            <h1>Contacto</h1>

            <p>

                Si te interesa trabajar conmigo o realizar una consulta,
                podés completar el siguiente formulario.

            </p>

        </section>

        <form class="contact-form">

    <div class="form-grid">

        <div class="form-group">

            <label>Nombre *</label>

            <input type="text" required>

        </div>

        <div class="form-group">

            <label>Apellido *</label>

            <input type="text" required>

        </div>

        <div class="form-group">

            <label>Email *</label>

            <input type="email" required>

        </div>

        <div class="form-group">

            <label>Teléfono</label>

            <input type="tel">

        </div>

    </div>

    <div class="form-group">

        <label>Tipo de consulta</label>

        <select>

            <option>Seleccionar</option>

            <option>Proyecto freelance</option>

            <option>Branding</option>

            <option>Diseño editorial</option>

            <option>Tipografía</option>

        </select>

    </div>

    <div class="form-group">

        <label>Mensaje *</label>

        <textarea
            placeholder="Escribí tu mensaje..."
            required></textarea>

    </div>

    <div class="checkbox-group">

        <label>

            <input type="checkbox" required>

            Acepto el tratamiento de los datos ingresados.

        </label>

    </div>

    <div class="form-buttons">

        <button type="reset">

            Limpiar

        </button>

        <button type="submit">

            Enviar

        </button>

    </div>

</form>

    </main>

</body>

</html>
