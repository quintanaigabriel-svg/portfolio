<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gabo Quintana</title>

    <link rel="stylesheet" href="../estilos.css">

    <link rel="icon" href="../img/favicon/faviconn.png" type="image/png">

</head>

<body>

    <main class="contact-page">

        <a href="../index.html" class="back-btn">

            ← Volver al portfolio

        </a>

        <section class="contact-header">

            <h1>Trabajemos juntos </h1>

            <p>

                Si te interesa trabajar conmigo o realizar una consulta, podés completar el siguiente formulario.

            </p>

        </section>

        <form class="contact-form">

    <section class="form-grid">

        <section class="form-group">

            <label>Nombre *</label>

            <input type="text" required>

        </section>

        <section class="form-group">

            <label>Apellido *</label>

            <input type="text" required>

        </section>

        <section class="form-group">

            <label>Email *</label>

            <input type="email" required>

        </section>

        <section class="form-group">

            <label>Teléfono</label>

            <input type="tel">

        </section>

    </section>

    <section class="form-group">

        <label>Tipo de consulta</label>

        <select>

            <option>Seleccionar</option>

            <option>Proyecto freelance</option>

            <option>Branding</option>

            <option>Diseño editorial</option>

            <option>Tipografía</option>

        </select>

    </section>

    <section class="form-group">

        <label>Mensaje *</label>

        <textarea
            placeholder="Escribí tu mensaje..."
            required></textarea>

    </section>

    <section class="checkbox-group">

        <label>

            <input type="checkbox" required>

            Acepto el tratamiento de los datos ingresados.

        </label>

    </section>

    <section class="form-buttons">

        <button type="reset">

            Limpiar

        </button>

        <button type="submit">

            Enviar

        </button>

    </section>

</form>

    </main>
    <footer>

    <section class="footer-info">
      <p>
        Gabriel Quintana · Portfolio 2026
      </p>
     </section>
       <section class="footer-social">

        <a href="https://www.instagram.com/tanacio.dg/"
           target="_blank">

            <img src="../img/social/instagram.png"
                 alt="Instagram">

        </a>

        <a href="https://www.behance.net/quintana"
           target="_blank">

            <img src="../img/social/behance.png"
                 alt="Behance">

        </a>

        <a href="https://www.linkedin.com/in/gabo-quintana-7a0714377/"
           target="_blank">

            <img src="../img/social/linkedin.png"
                 alt="LinkedIn">

        </a>

    </section>

</body>

</html>
